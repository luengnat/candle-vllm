[package]
name = "metal-kernels"
version = "0.1.0"
edition = "2021"
description = "Paged attention kernels for candle-vllm on Metal device"
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]
metal = { version = "0.27.0", features = ["mps"] }
thiserror = "1"
once_cell = "1.20.2"
candle-core = { git = "file:///Users/nat/dev/candle-gb", version = "0.8.3", rev = "5d5f08f64a2a4fc209264a3266afde9d853f46aa", features = ["metal"] }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }

[build-dependencies]
anyhow = { version = "1", features = ["backtrace"] }

[features]
metal4 = ["dep:objc2", "dep:objc2-metal"]
